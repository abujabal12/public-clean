<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة تنظيف الخدمات العامة</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
color: #1b5e20;
text-align: center;
padding: 30px 15px;
min-height: 100vh;
}
h1 {
font-size: 2.2rem;
margin-bottom: 10px;
color: #1b5e20;
letter-spacing: 0.5px;
}
.subtitle {
font-size: 1rem;
color: #4caf50;
margin-bottom: 30px;
font-weight: 500;
}
.gallery {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
gap: 18px;
max-width: 1100px;
margin: 0 auto;
}
.gallery img {
width: 100%;
height: 220px;
border-radius: 14px;
box-shadow: 0 6px 18px rgba(0,0,0,0.12);
object-fit: cover;
transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.gallery img:hover {
transform: scale(1.04);
box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
footer {
margin-top: 40px;
font-size: 0.9rem;
color: #81c784;
}
</style>
</head>
<body>

<h1>إدارة تنظيف الخدمات العامة</h1>
<p class="subtitle">خدمات نظافة شاملة للمرافق والمنشآت العامة</p>

<div class="gallery">
<img src="clean-1.jpg" alt="تنظيف الخدمات العامة 1">
<img src="clean-2.jpg" alt="تنظيف الخدمات العامة 2">
<img src="clean-3.jpg" alt="تنظيف الخدمات العامة 3">
<img src="clean-4.jpg" alt="تنظيف الخدمات العامة 4">
<img src="clean-5.jpg" alt="تنظيف الخدمات العامة 5">
<img src="clean-6.jpg" alt="تنظيف الخدمات العامة 6">
<img src="clean-7.jpg" alt="تنظيف الخدمات العامة 7">
<img src="clean-8.jpg" alt="تنظيف الخدمات العامة 8">
<img src="clean-9.jpg" alt="تنظيف الخدمات العامة 9">
<img src="clean-10.jpg" alt="تنظيف الخدمات العامة 10">
</div>

<footer>© جميع الحقوق محفوظة</footer>

</body>
</html>
